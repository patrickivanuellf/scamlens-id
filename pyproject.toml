[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scamlens-id"
version = "0.2.0"
description = "Pendeteksi pesan dan tautan penipuan berbahasa Indonesia (phishing, APK palsu, hadiah/THR palsu)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
scamlens = "scamlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
